name: Release · Android

# From jejezz/application-release-templates mobile/ @ conventions-v1.
# Template — see this template's README (application-release-templates/mobile) for setup and the __PLACEHOLDER__
# tokens to fill in before this is usable.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      track:
        description: "Play Console track to upload to"
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      build_number:
        description: "Override the build number (versionCode). Leave empty to use pubspec.yaml."
        required: false
        type: string

env:
  # Pin Flutter so re-running a tag rebuilds the same thing
  # (conventions/workflow.md §3). Bump it in a PR.
  FLUTTER_VERSION: "3.47.1"

jobs:
  # conventions/versioning.md: the tag must equal pubspec.yaml's version.
  # Skipped on a manual run (no tag).
  check-version:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches pubspec.yaml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | head -1 | sed -E 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/')
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec.yaml version $PUBSPEC_VERSION"
            exit 1
          fi

  release:
    needs: check-version
    # Run on a manual dispatch too, where check-version is skipped.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Build App Bundle
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${{ inputs.build_number }}" ]; then
            flutter build appbundle --release --build-number="${{ inputs.build_number }}"
          else
            flutter build appbundle --release
          fi

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: android

      - name: Decode Play Console service account key
        run: echo '${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}' > android/play-store-service-account.json

      - name: Upload to Play Console
        working-directory: android
        env:
          PLAY_STORE_JSON_KEY_PATH: play-store-service-account.json
        run: bundle exec fastlane deploy track:"${{ inputs.track || 'internal' }}"

      - name: Remove decoded secrets
        if: always()
        run: rm -f android/app/release.keystore android/play-store-service-account.json
