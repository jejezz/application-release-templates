name: app_updater
description: >-
  Checks a release server for a newer version of a desktop app, downloads the
  installer with SHA-256 verification, and hands it to the OS. Pure Dart.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  crypto: ^3.0.3
  http: ^1.2.0
  path: ^1.9.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
